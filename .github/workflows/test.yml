name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install

      - name: typecheck
        run: pnpm typecheck
        if: always()

      - name: test
        run: pnpm test
        if: always()

      - name: build
        run: pnpm build
        if: always()

      - name: built CLI runs
        run: node packages/cli/dist/index.js --version
